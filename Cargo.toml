[package]
name = "make-it-so"
version = "0.2.1"
edition = "2024"
description = "An experimental lazy command runner library"
authors = ["Andreas Maier <andreas.maier@ifj.edu.pl>"]
license = "GPL-3.0-or-later"
readme = "Readme.md"
keywords = ["task", "runner"]
categories = ["development-tools"]
repository = "https://github.com/a-maier/make-it-so"

[dependencies]
anyhow = "1.0.104"
bon = "3.10.0"
derive_more = { version = "2.1.1", features = ["display", "try_from"] }
libc = "0.2.189"
log = "0.4.34"
pete = "0.13.0"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
yaml_serde = "0.10.7"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
